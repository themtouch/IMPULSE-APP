name: Impulse
options:
  bundleIdPrefix: com.themtouch
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Impulse:
    type: application
    platform: iOS
    sources:
      - path: ios/Impulse
      - path: index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themtouch.impulse
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/Impulse/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
